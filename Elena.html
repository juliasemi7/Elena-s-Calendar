<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Календарь Елены</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        /* Package styling */
        .pkg-1 { background-color: #dcfce7; color: #14532d; border: 1px solid #86efac; }
        .pkg-2 { background-color: #f3e8ff; color: #581c87; border: 1px solid #d8b4fe; }
        .pkg-3 { background-color: #ffedd5; color: #7c2d12; border: 1px solid #fdba74; }
        .pkg-4 { background-color: #ccfbf1; color: #134e4a; border: 1px solid #5eead4; }
        .pkg-5 { background-color: #ffe4e6; color: #881337; border: 1px solid #fecdd3; }
        .pkg-6 { background-color: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }
        .pkg-7 { background-color: #fef3c7; color: #78350f; border: 1px solid #fde68a; }

        /* Lesson Indicator (Wed / Fri) */
        .has-lesson {
            outline: 2px solid #2563eb;
            outline-offset: -2px;
            font-weight: 800 !important;
            position: relative;
        }

        .has-lesson::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 5px;
            height: 5px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .weekend-day {
            background-color: #fff1f2;
            color: #e11d48;
        }
    </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm flex flex-col items-center justify-center text-center gap-2">
            <span class="px-3.5 py-1 rounded-lg bg-indigo-600 text-white font-extrabold text-sm tracking-wide">2026</span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Календарь Елены</h1>
        </header>

        <!-- Hover Info Bar -->
        <div id="info-bar" class="hidden transition-all duration-200 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-md flex items-center justify-between text-sm">
            <span id="info-date" class="font-bold text-indigo-300"></span>
            <span id="info-status" class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold text-slate-200"></span>
        </div>

        <main>
            <div id="calendar-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
        </main>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        const packages = [
            { id: 1, name: "Августовский пакет", period: "03 авг – 28 авг (20 рабочих дней; 4 занятия по понедельникам)", colorClass: "pkg-1", days: [
                "2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07",
                "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
                "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21",
                "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28"
            ]},
            { id: 2, name: "Сентябрьский пакет", period: "31 авг – 25 сен (20 рабочих дней; 4 занятия по понедельникам)", colorClass: "pkg-7", days: [
                "2026-08-31","2026-09-01","2026-09-02","2026-09-03","2026-09-04",
                "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
                "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18",
                "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25"
            ]},
            { id: 3, name: "Октябрьский пакет", period: "28 сен – 23 окт (20 рабочих дней; 4 занятия по понедельникам)", colorClass: "pkg-6", days: [
                "2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02",
                "2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09",
                "2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16",
                "2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23"
            ]}
        ];

        const lessons = [
          // Августовский пакет — только понедельники
          "2026-08-03","2026-08-10","2026-08-17","2026-08-24",
          // Сентябрьский пакет — только понедельники
          "2026-08-31","2026-09-07","2026-09-14","2026-09-21",
          // Октябрьский пакет — только понедельники
          "2026-09-28","2026-10-05","2026-10-12","2026-10-19"
       ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getPackageInfo(dateStr) {
            for (let pkg of packages) {
                if (pkg.days.includes(dateStr)) return pkg;
            }
            return null;
        }

        function isLesson(dateStr) { return lessons.includes(dateStr); }

        function createMonthCard(y, m) {
            const dim = getDaysInMonth(y, m);
            const off = getFirstDayOfMonth(y, m);
            const total = Math.ceil((off + dim) / 7) * 7;

            let html = `
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm transition-all duration-200 hover:shadow-md">
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800">${monthNames[m]}</h3>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-400 rounded-md">${y}</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center mb-1">
            `;

            dayNames.forEach((wd, idx) => {
                const isWk = idx >= 5;
                html += `<div class="text-xs font-bold ${isWk ? 'text-rose-500' : 'text-slate-400'} py-1">${wd}</div>`;
            });

            html += `</div><div class="grid grid-cols-7 gap-1 text-center">`;

            let day = 1;
            for (let i = 0; i < total; i++) {
                if (i >= off && day <= dim) {
                    const dateStr = formatDate(y, m, day);
                    const pkg = getPackageInfo(dateStr);
                    const hasLes = isLesson(dateStr);
                    const dateObj = new Date(y, m, day);
                    const isWk = dateObj.getDay() === 0 || dateObj.getDay() === 6;

                    let classes = "day-cell h-8 rounded-lg flex items-center justify-center text-xs font-semibold transition-all duration-150 cursor-pointer hover:scale-105 ";
                    
                    if (pkg) {
                        classes += `${pkg.colorClass} `;
                    } else if (isWk) {
                        classes += "weekend-day ";
                    } else {
                        classes += "text-slate-600 hover:bg-slate-100 ";
                    }

                    if (hasLes) {
                        classes += "has-lesson ";
                    }

                    let statusText = [];
                    if (pkg) statusText.push(`${pkg.name}`);
                    if (hasLes) statusText.push("Занятие Елены");
                    if (isWk && !pkg) statusText.push("Выходной");
                    if (statusText.length === 0) statusText.push("Свободный день");

                    const fullStatus = statusText.join(" • ");
                    const readableDate = `${day} ${monthNames[m]} ${y}`;

                    html += `
                        <div class="${classes}" 
                             data-date="${readableDate}"
                             data-status="${fullStatus}">
                            ${day}
                        </div>
                    `;
                    day++;
                } else {
                    html += `<div class="h-8"></div>`;
                }
            }

            html += `</div></div>`;
            return html;
        }

        function showInfo(date, status) {
            const bar = document.getElementById("info-bar");
            document.getElementById("info-date").textContent = date;
            document.getElementById("info-status").textContent = status;
            bar.classList.remove("hidden");
        }

        function hideInfo() {
            const bar = document.getElementById("info-bar");
            bar.classList.add("hidden");
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                container.innerHTML += createMonthCard(year, m);
            }
        }

        const container = document.getElementById("calendar-container");
        container.addEventListener("mouseover", (e) => {
            const dayCell = e.target.closest(".day-cell");
            if (dayCell && dayCell.dataset.date) {
                showInfo(dayCell.dataset.date, dayCell.dataset.status);
            }
        });

        container.addEventListener("mouseout", (e) => {
            const dayCell = e.target.closest(".day-cell");
            if (dayCell) {
                hideInfo();
            }
        });

        render();
    </script>
</body>
</html>
