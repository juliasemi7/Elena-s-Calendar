<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4a6fa5;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .year-label {
            font-size: 1.3rem;
            color: #4a6fa5;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .month-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .month-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .month-header {
            background-color: #4a6fa5;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .calendar {
            width: 100%;
            padding: 15px;
            border-collapse: collapse;
        }

        .calendar th {
            color: #4a6fa5;
            font-weight: 600;
            padding: 10px 5px;
            font-size: 0.9rem;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .calendar td {
            text-align: center;
            padding: 10px 5px;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: background-color 0.2s;
            position: relative;
            width: 40px;
            height: 40px;
        }

        .calendar td:hover {
            background-color: #f0f4ff;
        }

        .calendar td.weekend {
            color: #e74c3c;
            font-weight: 600;
            background-color: #FFF9F0;
        }

        .calendar td.package-1 { background-color: rgba(144, 238, 144, 0.4); font-weight: 600; }

        .calendar td.package-elena {
            font-weight: 700;
            border: 2px solid #1e6bb8;
            background-color: white;
        }

        .calendar td.both-1 { background-color: rgba(144, 238, 144, 0.4); font-weight: 700; border: 2px solid #1e6bb8; }

        .calendar td.other-month {
            color: #ccc;
        }

        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-border {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid;
        }

        .weekend-color { background-color: #FFF9F0; border: 1px solid #e74c3c; }
        .package-1-color { background-color: rgba(144, 238, 144, 0.4); border: 1px solid #90EE90; }
        .package-elena-color { background-color: white; border: 2px solid #1e6bb8; }
        .both-1-color { background-color: rgba(144, 238, 144, 0.4); border: 2px solid #1e6bb8; }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>2026</h1>
            <div class="year-label">Elena's Calendar</div>
        </header>

        <main>
            <div class="calendar-grid" id="calendar-container"></div>

            <div class="legend">
                <div class="legend-item"><div class="legend-color weekend-color"></div><span>Выходные дни</span></div>
                <div class="legend-item"><div class="legend-color package-1-color"></div><span>Пакет 20 дней (август)</span></div>
                <div class="legend-item"><div class="legend-border package-elena-color"></div><span>Занятие Елены</span></div>
                <div class="legend-item"><div class="legend-border both-1-color"></div><span>Пакет + занятие</span></div>
            </div>
        </main>

        <footer>
            <p>Календарь создан с использованием HTML, CSS и JavaScript</p>
            <p>© 2026 Календарь с выделенными пакетами дней</p>
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        // Пакет 1: 03.08 – 28.08 (20 рабочих дней)
        const package1 = [
            "2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07",
            "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
            "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21",
            "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28"
        ];

        // Занятия Елены (понедельник + пятница) — 8 занятий
        const lessons = [
            "2026-08-03","2026-08-07","2026-08-10","2026-08-14",
            "2026-08-17","2026-08-21","2026-08-24","2026-08-28"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function isInPackage(pkg, y, m, d) { return pkg.includes(formatDate(y, m, d)); }
        function isLesson(y, m, d) { return lessons.includes(formatDate(y, m, d)); }

        function createMonthCalendar(y, m) {
            const daysInMonth = getDaysInMonth(y, m);
            const startOffset = getFirstDayOfMonth(y, m);
            let html = `<div class="month-container"><div class="month-header">${monthNames[m]} ${y}</div><table class="calendar"><thead><tr>`;
            for (let wd of dayNames) {
                const isW = (wd === "Сб" || wd === "Вс");
                html += `<th${isW ? ' style="color:#e74c3c;"' : ''}>${wd}</th>`;
            }
            html += `</thead><tbody>`;
            let day = 1;
            let totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
            for (let i = 0; i < totalCells; i++) {
                if (i % 7 === 0) html += "<tr>";
                if (i >= startOffset && day <= daysInMonth) {
                    const in1 = isInPackage(package1, y, m, day);
                    const inLesson = isLesson(y, m, day);
                    const isWeekend = (new Date(y, m, day).getDay() === 0 || new Date(y, m, day).getDay() === 6);
                    let cls = isWeekend ? "weekend" : "";
                    if (in1 && inLesson) cls = "both-1";
                    else if (in1) cls = "package-1";
                    else if (inLesson) cls = "package-elena";
                    html += `<td class="${cls}">${day}</td>`;
                    day++;
                } else {
                    let prevMonth = m === 0 ? 11 : m - 1;
                    let prevYear = m === 0 ? y - 1 : y;
                    let daysPrev = getDaysInMonth(prevYear, prevMonth);
                    let prevDay = daysPrev - (startOffset - i - 1);
                    html += `<td class="other-month">${prevDay}</td>`;
                }
                if (i % 7 === 6) html += "</tr>";
            }
            html += `</tbody></table></div>`;
            return html;
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let month = 0; month < 12; month++) {
                container.innerHTML += createMonthCalendar(year, month);
            }
        }
        render();
    </script>
</body>
</html>
