<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 - Расписание Елены</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        /* Weekend style */
        .weekend {
            background-color: #fff5f5;
            color: #e53e3e;
            font-weight: 600;
        }

        /* Package 1 styles (Green theme) */
        .package-1 {
            background-color: #dcfce7;
            color: #15803d;
            font-weight: 600;
        }

        .package-elena {
            font-weight: 700;
            border: 2px solid #1e6bb8;
            background-color: #ffffff;
            color: #1e6bb8;
        }

        .both-1 {
            background-color: #dcfce7;
            color: #15803d;
            font-weight: 800;
            border: 2px solid #1e6bb8;
            box-shadow: inset 0 0 0 1px #1e6bb8;
        }

        /* Package 2 styles (Yellow/Amber/Orange theme) */
        .package-2 {
            background-color: #fef9c3;
            color: #a16207;
            font-weight: 600;
        }

        .package-elena-2 {
            font-weight: 700;
            border: 2px solid #e67e22;
            background-color: #ffffff;
            color: #d97706;
        }

        .both-2 {
            background-color: #fef9c3;
            color: #a16207;
            font-weight: 800;
            border: 2px solid #e67e22;
            box-shadow: inset 0 0 0 1px #e67e22;
        }

        .other-month {
            color: #cbd5e1;
            font-weight: 400;
        }

        /* Hover animation on calendar cells */
        .day-cell {
            transition: all 0.15s ease-in-out;
        }
        .day-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        /* Legend box markers */
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .legend-border {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .weekend-color { background-color: #fff5f5; border: 1.5px solid #feb2b2; }
        .package-1-color { background-color: #dcfce7; border: 1.5px solid #86efac; }
        .package-elena-color { background-color: #ffffff; border: 2px solid #1e6bb8; }
        .both-1-color { background-color: #dcfce7; border: 2px solid #1e6bb8; }
        
        .package-2-color { background-color: #fef9c3; border: 1.5px solid #fde047; }
        .package-elena-2-color { background-color: #ffffff; border: 2px solid #e67e22; }
        .both-2-color { background-color: #fef9c3; border: 2px solid #e67e22; }
    </style>
</head>
<body class="p-4 sm:p-8 font-sans antialiased">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center flex flex-col items-center justify-center gap-2">
            <h1 class="text-4xl sm:text-5xl font-black text-blue-900 tracking-tight">2026</h1>
            <div class="year-label text-blue-600 font-bold uppercase tracking-widest text-sm bg-blue-50 px-4 py-1 rounded-full border border-blue-100">
                Elena's Calendar
            </div>
        </header>

        <main class="space-y-10">
            <div class="calendar-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="calendar-container"></div>

            <div class="legend bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm max-w-4xl mx-auto">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 text-xs font-semibold text-slate-700">
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-color weekend-color"></div>
                        <span>Выходные дни</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-color package-1-color"></div>
                        <span>Пакет 1: 20 дней (авг)</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-border package-elena-color"></div>
                        <span>Занятия Пакет 1 (Пн, Пт)</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-border both-1-color"></div>
                        <span>Пакет 1 + занятие</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-color package-2-color"></div>
                        <span>Пакет 2: 20 дней (с 31.08)</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-border package-elena-2-color"></div>
                        <span>Занятия Пакет 2 (только Пн, 4 шт)</span>
                    </div>
                    <div class="legend-item flex items-center gap-3">
                        <div class="legend-border both-2-color"></div>
                        <span>Пакет 2 + занятие</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-12 text-center text-xs font-medium text-slate-400 space-y-1">
            <p>Календарь создан с использованием HTML, CSS и JavaScript</p>
            <p>© 2026 Календарь с расширенными пакетами дней</p>
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        // Пакет 1: 03.08 – 28.08 (20 рабочих дней)
        const package1 = [
            "2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07",
            "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
            "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21",
            "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28"
        ];

        // Занятия Елены для Пакет 1 (понедельник + пятница) — 8 занятий
        const lessons1 = [
            "2026-08-03","2026-08-07","2026-08-10","2026-08-14",
            "2026-08-17","2026-08-21","2026-08-24","2026-08-28"
        ];

        // Пакет 2: 20 будних дней, начиная с 31 августа 2026 (по 25 сентября 2026)
        const package2 = [
            "2026-08-31",
            "2026-09-01","2026-09-02","2026-09-03","2026-09-04",
            "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
            "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18",
            "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25"
        ];

        // Занятия Елены для Пакет 2 (только по понедельникам — ровно 4 штуки)
        const lessons2 = [
            "2026-08-31",
            "2026-09-07",
            "2026-09-14",
            "2026-09-21"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function isInList(list, y, m, d) { return list.includes(formatDate(y, m, d)); }

        function createMonthCalendar(y, m) {
            const daysInMonth = getDaysInMonth(y, m);
            const startOffset = getFirstDayOfMonth(y, m);
            
            let html = `
            <div class="month-container bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden flex flex-col">
                <div class="month-header bg-blue-600 text-white py-3 px-4 text-center font-bold text-base tracking-wide flex items-center justify-between">
                    <span>${monthNames[m]}</span>
                    <span class="text-xs text-blue-100 font-medium">${y}</span>
                </div>
                <div class="p-3.5 flex-1 flex flex-col justify-center">
                    <table class="calendar w-full border-separate border-spacing-1.5 text-center">
                        <thead>
                            <tr>`;
            
            for (let wd of dayNames) {
                const isW = (wd === "Сб" || wd === "Вс");
                html += `<th class="py-1 text-[11px] font-bold ${isW ? 'text-red-500' : 'text-slate-400'} uppercase">${wd}</th>`;
            }
            
            html += `</tr>
                        </thead>
                        <tbody>`;
            
            let day = 1;
            let totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
            
            for (let i = 0; i < totalCells; i++) {
                if (i % 7 === 0) html += "<tr>";
                
                if (i >= startOffset && day <= daysInMonth) {
                    const inPkg1 = isInList(package1, y, m, day);
                    const inLess1 = isInList(lessons1, y, m, day);
                    const inPkg2 = isInList(package2, y, m, day);
                    const inLess2 = isInList(lessons2, y, m, day);
                    const isWeekend = (new Date(y, m, day).getDay() === 0 || new Date(y, m, day).getDay() === 6);
                    
                    let cls = isWeekend ? "weekend" : "text-slate-700 font-medium bg-slate-50";
                    
                    if (inPkg1 && inLess1) cls = "both-1";
                    else if (inPkg2 && inLess2) cls = "both-2";
                    else if (inPkg1) cls = "package-1";
                    else if (inPkg2) cls = "package-2";
                    else if (inLess1) cls = "package-elena";
                    else if (inLess2) cls = "package-elena-2";

                    html += `<td class="day-cell h-8 w-8 text-xs rounded-lg align-middle ${cls}">${day}</td>`;
                    day++;
                } else {
                    let prevMonth = m === 0 ? 11 : m - 1;
                    let prevYear = m === 0 ? y - 1 : y;
                    let daysPrev = getDaysInMonth(prevYear, prevMonth);
                    let prevDay = daysPrev - (startOffset - i - 1);
                    html += `<td class="day-cell h-8 w-8 text-xs rounded-lg other-month align-middle">${prevDay}</td>`;
                }
                
                if (i % 7 === 6) html += "</tr>";
            }
            
            html += `</tbody></table></div></div>`;
            return html;
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let month = 0; month < 12; month++) {
                container.innerHTML += createMonthCalendar(year, month);
            }
        }
        
        render();
    </script>
</body>
</html>
